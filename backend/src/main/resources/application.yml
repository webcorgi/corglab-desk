spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/desk}
    username: ${POSTGRES_USER:desk}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
server:
  port: 8080
app:
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  tenant-id: ${TENANT_ID:00000000-0000-0000-0000-000000000001}
  openai-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4.1-nano}
